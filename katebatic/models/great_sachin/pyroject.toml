[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "your-pkg"
version = "0.1.0"
description = "Lightweight tabular synthesizers + TSTR utilities"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
xgb = ["xgboost>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["your_pkg*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
