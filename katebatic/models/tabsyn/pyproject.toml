[tool.poetry]
name = "tabsyn-wrapper"
version = "0.1.1"
description = "Wrapper that auto-bootstraps amazon-science/tabsyn for Katabatic."
authors = ["Katabatic Team <devnull@example.com>"]
readme = "README.md"
packages = [{ include = "tabsyn" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
torch = "^2.2.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
pyyaml = "^6.0.1"
tqdm = "^4.66.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
